    <path d="M614 180v25m-234-25v25" stroke="#b72f64" stroke-width="2"/><path d="m608 199 6 8 6-8m-240 0 6 8 6-8" fill="#b72f64"/>
    <g fill="#fff" stroke="#ecd5df" stroke-width="2"><rect x="38" y="215" width="218" height="66" rx="13"/><rect x="271" y="215" width="218" height="66" rx="13"/><rect x="504" y="215" width="218" height="66" rx="13"/></g>
    <g fill="#48303d" font-size="16" font-weight="700"><text x="147" y="244">Bronze · raw</text><text x="380" y="244">Silver · cleaned</text><text x="613" y="244">Gold · features</text></g>
    <g fill="#795e6b" font-size="13"><text x="147" y="265">collected articles</text><text x="380" y="265">standardized records</text><text x="613" y="265">analytical datasets</text></g>

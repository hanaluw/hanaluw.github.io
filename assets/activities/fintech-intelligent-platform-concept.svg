<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">Project Fintech Intelligent Platform</title>
  <desc id="desc">A proposed offline news data pipeline that prepares curated fintech data for NLP and future knowledge-graph work.</desc>
  <rect width="760" height="480" rx="22" fill="#fff4f8"/>
  <text x="38" y="48" fill="#b72f64" font-family="Lora,Georgia,serif" font-size="21" font-weight="700">FINTECH INTELLIGENT PLATFORM</text>
  <text x="38" y="77" fill="#48303d" font-family="Lora,Georgia,serif" font-size="15">Proposed offline pipeline · extension of thesis research</text>
  <g font-family="Lora,Georgia,serif" text-anchor="middle">
    <rect x="42" y="111" width="176" height="68" rx="13" fill="#fff" stroke="#ecd5df" stroke-width="2"/>
